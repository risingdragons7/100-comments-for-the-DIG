  .stats { text-align: center; color: var(--muted); margin-bottom: 12px; font-size: 0.9rem; }
  #comments {

  .comment-num { color: var(--muted); font-size: 0.85rem; min-width: 36px; font-weight: 600; }

let remaining = [...pool];
let visible = [];
const VISIBLE_COUNT = 100;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function init() {
  remaining = shuffle([...pool]);
  visible = remaining.splice(0, VISIBLE_COUNT);
  render();
}

function render() {
  const container = document.getElementById('comments');
  container.innerHTML = '';
  visible.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'comment-row';
    row.dataset.index = i;

    const num = document.createElement('span');
    num.className = 'comment-num';
    num.textContent = (i + 1) + '.';

    const span = document.createElement('span');
    span.className = 'comment-text';
    span.textContent = text;

    const btn = document.createElement('button');
    btn.className = 'copy-one';
    btn.textContent = 'Copy';
    btn.onclick = () => copyAndRotate(i, btn, row);

    row.appendChild(num);
    row.appendChild(span);
    row.appendChild(btn);
    container.appendChild(row);
  });
  document.getElementById('visibleCount').textContent = visible.length;
  document.getElementById('poolCount').textContent = remaining.length;
}

function copyAndRotate(index, btn, row) {
  const text = visible[index];
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('success');
    row.classList.add('used');

    // Replace with a new one if available
    setTimeout(() => {
      if (remaining.length > 0) {
        visible[index] = remaining.shift();
        render();
        document.getElementById('copyStatus').textContent = '✅ Copied & rotated to a fresh comment';
      } else {
        btn.textContent = 'Used';
        btn.disabled = true;
        document.getElementById('copyStatus').textContent = '✅ Copied (pool empty — all unique comments used)';
      }
      setTimeout(() => {
        document.getElementById('copyStatus').textContent = '';
      }, 1800);
    }, 400);
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1200);
  });
}

function copyAllVisible() {
  const text = visible.join('\\n');
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('copyStatus').textContent = '✅ All visible comments copied!';
    document.getElementById('copyAllBtn').classList.add('success');
    setTimeout(() => {
      document.getElementById('copyStatus').textContent = '';
      document.getElementById('copyAllBtn').classList.remove('success');
    }, 2000);
  });
}

function resetAll() {
  init();
  document.getElementById('copyStatus').textContent = 'List reset with fresh random comments';
  setTimeout(() => document.getElementById('copyStatus').textContent = '', 1500);
}

function downloadTxt() {
  const blob = new Blob([visible.join('\\n')], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'senseibulrog-comments-current.txt';
  a.click();
  URL.revokeObjectURL(url);
}

init();
