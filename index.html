<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Raw Tetra Hydrinium Farm Comments - SenseiBulrog</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --text: #c9d1d9;
    --muted: #8b949e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    line-height: 1.5;
  }
  h1 {
    text-align: center;
    color: var(--accent);
    margin-bottom: 8px;
    font-size: 1.8rem;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 24px;
    font-size: 0.95rem;
  }
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  button {
    background: var(--accent);
    color: #0d1117;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  button:hover { filter: brightness(1.1); transform: translateY(-1px); }
  button.secondary {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.success { background: var(--accent2); }
  button.copy-one {
    padding: 6px 12px;
    font-size: 0.85rem;
    min-width: 70px;
  }
  .stats {
    text-align: center;
    color: var(--muted);
    margin-bottom: 16px;
    font-size: 0.9rem;
  }
  #comments {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    max-height: 65vh;
    overflow-y: auto;
    margin-bottom: 20px;
  }
  .comment-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .comment-row:last-child { border-bottom: none; }
  .comment-row:hover { background: rgba(88, 166, 255, 0.08); }
  .comment-num {
    color: var(--muted);
    font-size: 0.85rem;
    min-width: 32px;
    font-weight: 600;
  }
  .comment-text {
    flex: 1;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.92rem;
    word-break: break-word;
  }
  .copy-all-wrap {
    text-align: center;
    margin-top: 10px;
  }
  #copyStatus {
    display: block;
    margin-top: 10px;
    color: var(--accent2);
    font-weight: 600;
    min-height: 1.4em;
  }
  .footer {
    text-align: center;
    margin-top: 30px;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<h1>Raw Tetra Hydrinium Farm</h1>
<p class="subtitle">100 chat comments for SenseiBulrog's stream • Click any Copy button or Copy All</p>

<div class="controls">
  <button id="copyAllBtn" onclick="copyAll()">Copy All Comments</button>
  <button class="secondary" onclick="downloadTxt()">Download as .txt</button>
</div>

<div class="stats">
  Total comments: <strong>100</strong> • Individual copy buttons + Copy All
</div>

<div id="comments"></div>

<div class="copy-all-wrap">
  <button id="copyAllBtnBottom" onclick="copyAll()" style="font-size:1.1rem; padding:14px 36px;">
    Copy All 100 Comments
  </button>
  <span id="copyStatus"></span>
</div>

<p class="footer">
  For SenseiBulrog / Faded Monsuta loyalty & !dig farming • Use responsibly
</p>

<script>

"Chat, let's get this dig going",
"Sensei is the best",
"Another message in the books",
"Faded Monsuta forever",
"Raw Tetra Hydrinium loading complete"
];

const container = document.getElementById('comments');
const fullText = comments.join('\n');

comments.forEach((text, i) => {
  const row = document.createElement('div');
  row.className = 'comment-row';

  const num = document.createElement('span');
  num.className = 'comment-num';
  num.textContent = (i + 1) + '.';

  const span = document.createElement('span');
  span.className = 'comment-text';
  span.textContent = text;

  const btn = document.createElement('button');
  btn.className = 'copy-one';
  btn.textContent = 'Copy';
  btn.onclick = function() {
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = 'Copied!';
      btn.classList.add('success');
      setTimeout(() => {
        btn.textContent = 'Copy';
        btn.classList.remove('success');
      }, 1200);
    }).catch(() => {
      // Fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1200);
    });
  };

  row.appendChild(num);
  row.appendChild(span);
  row.appendChild(btn);
  container.appendChild(row);
});

function copyAll() {
  navigator.clipboard.writeText(fullText).then(() => {
    const status = document.getElementById('copyStatus');
    status.textContent = '✅ All 100 comments copied!';
    const btn = document.getElementById('copyAllBtn');
    const btn2 = document.getElementById('copyAllBtnBottom');
    btn.classList.add('success');
    btn2.classList.add('success');
    btn.textContent = 'Copied!';
    btn2.textContent = 'Copied!';
    setTimeout(() => {
      status.textContent = '';
      btn.classList.remove('success');
      btn2.classList.remove('success');
      btn.textContent = 'Copy All Comments';
      btn2.textContent = 'Copy All 100 Comments';
    }, 2500);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = fullText;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    document.getElementById('copyStatus').textContent = '✅ All 100 comments copied!';
  });
}

function downloadTxt() {
  const blob = new Blob([fullText], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'senseibulrog-100-comments.txt';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
